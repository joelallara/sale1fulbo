<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sale1fulbo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 1em; }
    .match { border: 1px solid #ccc; padding: 0.5em; margin: 0.5em 0; }
    @media (max-width: 600px) {
      body { font-size: 18px; }
    }
  </style>
</head>
<body>
  <h1>Partidos</h1>
  <div id="match-list"></div>

  <h2>Crear partido</h2>
  <form id="match-form">
    <input type="text" id="name" placeholder="Nombre del partido" required />
    <input type="text" id="field" placeholder="Cancha" required />
    <button type="submit">Crear</button>
  </form>

  <script>
    async function loadMatches() {
      const res = await fetch('/matches');
      const matches = await res.json();
      const list = document.getElementById('match-list');
      list.innerHTML = '';
      matches.forEach(m => {
        const div = document.createElement('div');
        div.className = 'match';
        div.textContent = `${m.name} - ${m.field}`;
        list.appendChild(div);
      });
    }

    document.getElementById('match-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const field = document.getElementById('field').value;
      await fetch('/matches', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, field })
      });
      document.getElementById('name').value = '';
      document.getElementById('field').value = '';
      loadMatches();
    });

    loadMatches();
  </script>
</body>
</html>
